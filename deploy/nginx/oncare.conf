# 개인 서버 배포용 nginx 사이트 (private-deploy 브랜치 전용).
# Tailscale Funnel 이 공개 HTTPS(https://flc.tailf0d4a.ts.net)를 끝내고 이 포트로 넘긴다.
# 외부에는 열지 않는다 — 127.0.0.1 에서만 듣는다.
#
# 설치: sudo ln -sf /home/yoshi/oncare/deploy/nginx/oncare.conf /etc/nginx/sites-enabled/oncare.conf
server {
    listen 127.0.0.1:8090;
    server_name _;

    root /srv/oncare/www;
    # 백엔드 업로드 상한(MAX_UPLOAD_BYTES 10MiB)보다 약간 크게.
    client_max_body_size 12m;

    location = / {
        return 302 /frontend/;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TLS 는 Funnel 이 끝냈으므로 원래 요청은 항상 https 다(FORCE_HTTPS 판정용).
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 새 배포를 바로 알아채도록 진입 파일은 캐시하지 않는다.
    location ~ ^/(frontend|trainer)/(index\.html|version\.txt|flutter_service_worker\.js|flutter_bootstrap\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # nginx 1.18 mime.types 에 wasm 이 없다(drift sqlite3.wasm).
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    location /frontend/ {
        try_files $uri $uri/ /frontend/index.html;
    }

    location /trainer/ {
        try_files $uri $uri/ /trainer/index.html;
    }

    location /legal/ {
        try_files $uri =404;
    }
}
